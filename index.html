<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBX Store — демо пополнения</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body {
    background: radial-gradient(circle at top, #1e2a44, #0b0f1a 70%);
    color: #e8eefc;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .demo-banner {
    background: #ffb703;
    color: #1a1a1a;
    text-align: center;
    padding: 8px;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: .5px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 6vw;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .logo { font-size: 24px; font-weight: 800; color: #fff; }
  .logo span { color: #00b06f; }
  .balance {
    background: rgba(0,176,111,.15);
    border: 1px solid #00b06f;
    color: #4dffb0;
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 14px;
  }
  main { flex: 1; padding: 40px 6vw 80px; max-width: 1100px; margin: 0 auto; width: 100%; }
  h1 { font-size: clamp(26px, 4vw, 40px); margin-bottom: 10px; }
  .subtitle { color: #93a1bd; margin-bottom: 36px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }
  .card {
    background: linear-gradient(160deg, #1b2440, #141b30);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px;
    padding: 24px 20px;
    text-align: center;
    cursor: pointer;
    transition: .25s;
    position: relative;
    overflow: hidden;
  }
  .card:hover { transform: translateY(-4px); border-color: #00b06f; box-shadow: 0 12px 30px rgba(0,176,111,.18); }
  .card.selected { border-color: #00b06f; background: linear-gradient(160deg, #173a2c, #12261f); }
  .card .icon { font-size: 34px; margin-bottom: 10px; }
  .card .amount { font-size: 26px; font-weight: 800; color: #fff; }
  .card .amount small { font-size: 15px; color: #9fb0cc; font-weight: 500; }
  .card .price {
    margin-top: 14px;
    display: inline-block;
    background: #00b06f;
    color: #04240f;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 14px;
  }
  .tag {
    position: absolute; top: 10px; right: -32px;
    background: #ffb703; color: #1a1a1a;
    font-size: 11px; font-weight: 800;
    padding: 4px 40px; transform: rotate(35deg);
  }
  .checkout {
    margin-top: 34px;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px;
    padding: 22px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    justify-content: space-between;
  }
  .summary { color: #93a1bd; font-size: 15px; }
  .summary b { color: #fff; font-size: 18px; }
  button.pay {
    background: linear-gradient(135deg, #00d180, #00a065);
    border: none;
    color: #04240f;
    font-weight: 800;
    font-size: 16px;
    padding: 14px 32px;
    border-radius: 12px;
    cursor: pointer;
    transition: .2s;
  }
  button.pay:hover { filter: brightness(1.1); transform: scale(1.02); }
  button.pay:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .method { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .method label {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid rgba(255,255,255,.12);
    padding: 10px 16px; border-radius: 10px; cursor: pointer;
    font-size: 14px; color: #c3cee3;
  }
  .method input { accent-color: #00b06f; }
  .method label:has(input:checked) { border-color: #00b06f; background: rgba(0,176,111,.1); color: #fff; }
  .nick-input {
    width: 100%; margin-bottom: 24px;
    background: #0f1626;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    padding: 14px 16px;
    color: #fff; font-size: 15px;
  }
  .nick-input:focus { outline: none; border-color: #00b06f; }
  footer { text-align: center; padding: 24px; color: #56637a; font-size: 13px; }
  .toast {
    position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
    background: #00b06f; color: #04240f; font-weight: 700;
    padding: 14px 26px; border-radius: 12px;
    transition: .4s; z-index: 50; font-size: 15px;
  }
  .toast.show { bottom: 30px; }
</style>
</head>
<body>

<div class="demo-banner">⚠ ДЕМО-РЕЖИМ: это макет интерфейса. Реальные платежи и Robux не проводятся.</div>

<header>
  <div class="logo">RBX<span>Store</span></div>
  <div class="balance">Баланс: 0 R$</div>
</header>

<main>
  <h1>Пополнить Robux</h1>
  <p class="subtitle">Выберите пакет, укажите ник и способ оплаты.</p>

  <input class="nick-input" id="nick" type="text" placeholder="Ваш никнейм в Roblox (например, Builderman)" maxlength="20">

  <div class="grid" id="grid"></div>

  <div class="checkout">
    <div class="summary" id="summary">Ничего не выбрано</div>
    <button class="pay" id="payBtn" disabled>Оплатить</button>
  </div>

  <div style="margin-top:28px">
    <div class="method">
      <label><input type="radio" name="pay" value="Карта" checked> 💳 Банковская карта</label>
      <label><input type="radio" name="pay" value="СБП"> 📱 СБП</label>
      <label><input type="radio" name="pay" value="Крипта"> ₿ Криптовалюта</label>
    </div>
  </div>
</main>

<footer>Демо-версия. Не связано с Roblox Corporation. Все данные вымышлены.</footer>

<div class="toast" id="toast"></div>

<script>
  const packs = [
    { robux: 400,   price: 349,  tag: '' },
    { robux: 800,   price: 649,  tag: 'ХИТ' },
    { robux: 1700,  price: 1290, tag: '' },
    { robux: 4500,  price: 3190, tag: 'ВЫГОДНО' },
    { robux: 10000, price: 6690, tag: '' },
    { robux: 22500, price: 13990, tag: 'MAX' },
  ];

  let selected = null;
  const grid = document.getElementById('grid');
  const summary = document.getElementById('summary');
  const payBtn = document.getElementById('payBtn');

  packs.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      ${p.tag ? `<div class="tag">${p.tag}</div>` : ''}
      <div class="icon">💰</div>
      <div class="amount">${p.robux.toLocaleString('ru-RU')} <small>R$</small></div>
      <div class="price">${p.price.toLocaleString('ru-RU')} ₽</div>
    `;
    el.onclick = () => select(i, el);
    grid.appendChild(el);
  });

  function select(i, el) {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selected = packs[i];
    summary.innerHTML = `Выбрано: <b>${selected.robux.toLocaleString('ru-RU')} R$</b> за <b>${selected.price.toLocaleString('ru-RU')} ₽</b>`;
    payBtn.disabled = false;
  }

  payBtn.onclick = () => {
    const nick = document.getElementById('nick').value.trim();
    if (!nick) { showToast('Сначала укажите никнейм!'); return; }
    const method = document.querySelector('input[name="pay"]:checked').value;
    payBtn.disabled = true;
    payBtn.textContent = 'Обработка...';
    setTimeout(() => {
      showToast(`Демо: ${selected.robux} R$ для «${nick}» — оплата через ${method} (симуляция)`);
      payBtn.textContent = 'Оплатить';
      payBtn.disabled = false;
    }, 1200);
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 3500);
  }
</script>
</body>
</html>
