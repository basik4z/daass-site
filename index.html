<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДААСС</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>ДААСС</h1>
            <p>Твой помощник в Telegram</p>
        </div>
        <div class="stats">
            <div class="stat"><span>📦</span> <span id="msgCount">0</span></div>
            <div class="stat"><span>❌</span> <span id="delCount">0</span></div>
            <div class="stat"><span>✏️</span> <span id="editCount">0</span></div>
        </div>
        <div class="features">
            <div class="card">📦 Удалённые</div>
            <div class="card">✏️ Изменённые</div>
            <div class="card">👁 View Once</div>
            <div class="card">📤 Экспорт</div>
        </div>
        <button id="exportBtn">📦 Экспортировать чат</button>
        <div class="footer">ДААСС • 7 дней бесплатно</div>
    </div>
    <script src="app.js"></script>
</body>
</html>
